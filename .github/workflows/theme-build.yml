name: Theme build

# Regenerates the black & white README cards (theme/build.js) from theme/profile.json,
# live GitHub/Medium data, and the summary-card + 3D-graph SVGs the other workflows produce.
on:
  schedule:
    - cron: "30 19 * * *" # daily, after the 18:00 UTC card workflows
  workflow_run:
    workflows: ["GitHub-Profile-3D-Contrib", "GitHub-Profile-Summary-Cards"]
    types: [completed]
  push:
    branches: [main]
    paths: ["theme/profile.json", "theme/tokens.json", "theme/build.js"]
  workflow_dispatch:

concurrency:
  group: theme-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build theme
        run: node theme/build.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
      - name: Commit & push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A theme TEST.md README.md
          git diff --cached --quiet && exit 0
          git commit -m "theme: rebuild"
          git pull --rebase origin main
          git push
