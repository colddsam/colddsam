<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 246" width="1000" height="246" fill="none" role="img" aria-label="Latest blog posts">
  <style>
    .m{font-family:ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}
    text{fill:#000000}
    .ln{stroke:#000000;stroke-width:1;fill:none}
    .ink{fill:#000000}
    .stroke{stroke:#000000;fill:none}
    .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .fade{opacity:0;animation:fade .7s ease forwards}
    @keyframes fade{to{opacity:1}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
    @keyframes ring{0%{transform:scale(.4);opacity:.8}80%,100%{transform:scale(2.6);opacity:0}}
    .grow{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes grow{to{transform:scaleX(1)}}
    .eq{transform-box:fill-box;transform-origin:bottom;animation:eq .9s ease-in-out infinite alternate}
    @keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 3.2s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.draw,.rise,.fade,.pulse,.ring,.grow,.eq,.spin{animation:none}.draw{stroke-dashoffset:0}.rise,.fade{opacity:1}.grow{transform:none}.ring{opacity:0}}
  </style>
  <g class="fade" style="animation-delay:0.1s"><text class="m" x="48" y="28" font-size="11" letter-spacing="3.5">LATEST FROM MEDIUM</text><text class="m" x="952" y="28" font-size="11" letter-spacing="3.5" text-anchor="end">FIG. 04.1</text></g><line class="ln draw" x1="48" y1="40" x2="952" y2="40" pathLength="1" opacity="1" style="animation-delay:0.1s"/>
  <g class="rise" style="animation-delay:0.2s"><text class="m" x="48" y="78" font-size="11" letter-spacing="2.5">Nº 01</text><text class="m" x="130" y="78" font-size="15">The Future of Quantum Computing: What’s Next for Qubits?</text><text class="m" x="952" y="78" font-size="11" letter-spacing="2" text-anchor="end">07 SEP 2024</text></g>
  <line class="ln" x1="48" y1="94" x2="952" y2="94" opacity="0.25"/>
  <g class="rise" style="animation-delay:0.28s"><text class="m" x="48" y="118" font-size="11" letter-spacing="2.5">Nº 02</text><text class="m" x="130" y="118" font-size="15">Unveiling the Secrets of Machine Learning: A Comprehensive Guide</text><text class="m" x="952" y="118" font-size="11" letter-spacing="2" text-anchor="end">06 SEP 2024</text></g>
  <line class="ln" x1="48" y1="134" x2="952" y2="134" opacity="0.25"/>
  <g class="rise" style="animation-delay:0.36s"><text class="m" x="48" y="158" font-size="11" letter-spacing="2.5">Nº 03</text><text class="m" x="130" y="158" font-size="15">Unveiling the Secrets of Neural Networks: A Comprehensive Guide for Beginners</text><text class="m" x="952" y="158" font-size="11" letter-spacing="2" text-anchor="end">05 SEP 2024</text></g>
  <line class="ln" x1="48" y1="174" x2="952" y2="174" opacity="0.25"/>
  <g class="rise" style="animation-delay:0.44s"><text class="m" x="48" y="198" font-size="11" letter-spacing="2.5">Nº 04</text><text class="m" x="130" y="198" font-size="15">Unlock the Power of Quantum Computing: 5 Practical Applications to</text><text class="m" x="130" y="220" font-size="15">Supercharge Your Business</text><text class="m" x="952" y="198" font-size="11" letter-spacing="2" text-anchor="end">04 SEP 2024</text></g>
</svg>
