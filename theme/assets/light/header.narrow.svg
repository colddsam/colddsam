<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 456" width="400" height="456" fill="none" role="img" aria-label="Samrat Kumar Das — ML Engineer &amp; Front-End Developer — Kolkata, India.">
  <style>
    .m{font-family:ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}
    text{fill:#000000}
    .ln{stroke:#000000;stroke-width:1;fill:none}
    .ink{fill:#000000}
    .stroke{stroke:#000000;fill:none}
    .outline{stroke:#000000}
    text.paper{fill:#FFFFFF}
    .pp{fill:#FFFFFF}
    .pop{transform-box:fill-box;transform-origin:center;opacity:0;animation:pop .5s cubic-bezier(.2,1.4,.4,1) forwards}
    @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
    .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .fade{opacity:0;animation:fade .7s ease forwards}
    @keyframes fade{to{opacity:1}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
    @keyframes ring{0%{transform:scale(.4);opacity:.8}80%,100%{transform:scale(2.6);opacity:0}}
    .grow{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes grow{to{transform:scaleX(1)}}
    .eq{transform-box:fill-box;transform-origin:bottom;animation:eq .9s ease-in-out infinite alternate}
    @keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 3.2s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .caret{animation:caret 1.1s steps(1) infinite}
    @keyframes caret{50%{fill-opacity:0}}
    .nudge{animation:nudge 1.6s ease-in-out infinite}
    @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
    @media (prefers-reduced-motion:reduce){.draw,.rise,.fade,.pulse,.ring,.grow,.eq,.spin,.blink,.caret,.nudge,.anim,.pop{animation:none}.draw{stroke-dashoffset:0}.rise,.fade,.pop{opacity:1}.grow{transform:none}.ring{opacity:0}}
  </style>
  <g class="fade" style="animation-delay:0.2s"><text class="m" x="16" y="44" font-size="11" letter-spacing="1.75">PROFILE — INDEX Nº 001</text><text class="m" x="384" y="44" font-size="11" letter-spacing="1.75" text-anchor="end">KOLKATA, IN</text></g>
  <line class="ln draw" x1="16" y1="58" x2="384" y2="58" pathLength="1" opacity="1" style="animation-delay:0.2s"/>
  <g class="rise" style="animation-delay:0.5s"><text class="m" x="15" y="116" font-size="44" letter-spacing="-0.75">Samrat Kumar</text></g>
  <g class="rise" style="animation-delay:0.6s"><text class="m" x="15" y="166" font-size="44" letter-spacing="-0.75">Das</text></g>
  <g class="fade" style="animation-delay:0.9s"><text class="m" x="16" y="206" font-size="17">ML Engineer &amp; Front-End Developer —</text></g>
  <g class="fade" style="animation-delay:0.9s"><text class="m" x="16" y="232" font-size="17">Kolkata, India.</text></g>
  <g class="fade" style="animation-delay:1.2s"><text class="m" x="16" y="276" font-size="13" letter-spacing="0.5">focus ▸ machine learning · front-end</text></g>
  <g class="fade" style="animation-delay:1.2s"><text class="m" x="16" y="298" font-size="13" letter-spacing="0.5">development · open source</text></g>
  <g class="fade" style="animation-delay:1.4s"><text class="m" x="16" y="326" font-size="13" letter-spacing="0.5">a passionate ML engineer looking for an</text></g>
  <g class="fade" style="animation-delay:1.4s"><text class="m" x="16" y="348" font-size="13" letter-spacing="0.5">opportunity to grab an internship. <tspan class="caret">█</tspan></text></g>
  <line class="ln draw" x1="16" y1="382" x2="384" y2="382" pathLength="1" opacity="1" style="animation-delay:1.4s"/>
  <g class="fade" style="animation-delay:1.7s"><text class="m" x="16" y="412" font-size="11.5" letter-spacing="1.5">AI / ML · FRONT END · DATA STRUCTURES</text></g>
  <g class="fade" style="animation-delay:1.7s"><text class="m" x="16" y="434" font-size="11.5" letter-spacing="1.5">B.TECH ECE — 4TH YEAR</text></g>
</svg>
