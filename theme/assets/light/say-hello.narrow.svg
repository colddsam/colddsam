<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 392" width="400" height="392" fill="none" role="img" aria-label="Let's build something worth shipping. Internships, open-source, hackathons or a wild ML idea — my inbox is open and I reply to every message. colddsam@gmail.com">
  <style>
    .m{font-family:ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}
    text{fill:#000000}
    .ln{stroke:#000000;stroke-width:1;fill:none}
    .ink{fill:#000000}
    .stroke{stroke:#000000;fill:none}
    .outline{stroke:#000000}
    text.paper{fill:#FFFFFF}
    .pp{fill:#FFFFFF}
    .pop{transform-box:fill-box;transform-origin:center;opacity:0;animation:pop .5s cubic-bezier(.2,1.4,.4,1) forwards}
    @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
    .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .fade{opacity:0;animation:fade .7s ease forwards}
    @keyframes fade{to{opacity:1}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
    @keyframes ring{0%{transform:scale(.4);opacity:.8}80%,100%{transform:scale(2.6);opacity:0}}
    .grow{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes grow{to{transform:scaleX(1)}}
    .eq{transform-box:fill-box;transform-origin:bottom;animation:eq .9s ease-in-out infinite alternate}
    @keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 3.2s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .caret{animation:caret 1.1s steps(1) infinite}
    @keyframes caret{50%{fill-opacity:0}}
    .nudge{animation:nudge 1.6s ease-in-out infinite}
    @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
    @media (prefers-reduced-motion:reduce){.draw,.rise,.fade,.pulse,.ring,.grow,.eq,.spin,.blink,.caret,.nudge,.anim,.pop{animation:none}.draw{stroke-dashoffset:0}.rise,.fade,.pop{opacity:1}.grow{transform:none}.ring{opacity:0}}
  </style>
  <g class="fade" style="animation-delay:0.1s"><text class="m" x="16" y="28" font-size="11" letter-spacing="1.75">OPEN INBOX</text><text class="m" x="384" y="28" font-size="11" letter-spacing="1.75" text-anchor="end">FIG. 16.1</text></g><line class="ln draw" x1="16" y1="40" x2="384" y2="40" pathLength="1" opacity="1" style="animation-delay:0.1s"/>
  <g class="rise" style="animation-delay:0.2s"><text class="m" x="14" y="96" font-size="32" letter-spacing="-0.75">Let's build</text></g>
  <g class="rise" style="animation-delay:0.30000000000000004s"><text class="m" x="14" y="136" font-size="32" letter-spacing="-0.75">something worth</text></g>
  <g class="rise" style="animation-delay:0.4s"><text class="m" x="14" y="176" font-size="32" letter-spacing="-0.75">shipping.</text></g>
  <g class="fade" style="animation-delay:0.5s"><text class="m" x="16" y="216" font-size="16">Internships, open-source, hackathons</text></g>
  <g class="fade" style="animation-delay:0.5s"><text class="m" x="16" y="242" font-size="16">or a wild ML idea — my inbox is open</text></g>
  <g class="fade" style="animation-delay:0.5s"><text class="m" x="16" y="268" font-size="16">and I reply to every message.</text></g>
  <line class="ln draw" x1="16" y1="294" x2="384" y2="294" pathLength="1" opacity="0.5" style="animation-delay:0.6s"/>
  <g class="fade" style="animation-delay:0.8s"><circle class="stroke ring" cx="21" cy="326" r="5"/><circle class="ink pulse" cx="21" cy="326" r="4"/><text class="m" x="40" y="330" font-size="11" letter-spacing="1.5">AVAILABLE NOW · REPLIES WITHIN 24H</text></g>
  <g class="fade" style="animation-delay:0.9s"><text class="m" x="350" y="367" font-size="18" text-anchor="end">colddsam@gmail.com</text><g class="nudge"><path class="ln" stroke-width="1.5" d="M360 361 H382 M375 354 L382 361 L375 368"/></g></g>
</svg>
