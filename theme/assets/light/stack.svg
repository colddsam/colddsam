<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 224" width="1000" height="224" fill="none" role="img" aria-label="Technical stack">
  <style>
    .m{font-family:ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}
    text{fill:#000000}
    .ln{stroke:#000000;stroke-width:1;fill:none}
    .ink{fill:#000000}
    .stroke{stroke:#000000;fill:none}
    .outline{stroke:#000000}
    .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .fade{opacity:0;animation:fade .7s ease forwards}
    @keyframes fade{to{opacity:1}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
    @keyframes ring{0%{transform:scale(.4);opacity:.8}80%,100%{transform:scale(2.6);opacity:0}}
    .grow{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes grow{to{transform:scaleX(1)}}
    .eq{transform-box:fill-box;transform-origin:bottom;animation:eq .9s ease-in-out infinite alternate}
    @keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 3.2s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .caret{animation:caret 1.1s steps(1) infinite}
    @keyframes caret{50%{fill-opacity:0}}
    .nudge{animation:nudge 1.6s ease-in-out infinite}
    @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
    @media (prefers-reduced-motion:reduce){.draw,.rise,.fade,.pulse,.ring,.grow,.eq,.spin,.blink,.caret,.nudge,.anim{animation:none}.draw{stroke-dashoffset:0}.rise,.fade{opacity:1}.grow{transform:none}.ring{opacity:0}}
  </style>
  <line class="ln" x1="148" y1="8" x2="148" y2="214" opacity="0.4"/>
  <g class="rise" style="animation-delay:0.1s"><text class="m" x="48" y="32" font-size="11" letter-spacing="2.5">LANGUAGES</text><text class="m" x="164" y="32" font-size="15">C · C++ · Python · JavaScript · Dart</text></g>
  <g class="rise" style="animation-delay:0.18s"><text class="m" x="48" y="66" font-size="11" letter-spacing="2.5">WEB</text><text class="m" x="164" y="66" font-size="15">HTML · CSS · Sass · React</text></g>
  <g class="rise" style="animation-delay:0.26s"><text class="m" x="48" y="100" font-size="11" letter-spacing="2.5">BACKEND</text><text class="m" x="164" y="100" font-size="15">Node.js · Express · Flask · FastAPI · MongoDB</text></g>
  <g class="rise" style="animation-delay:0.34s"><text class="m" x="48" y="134" font-size="11" letter-spacing="2.5">ML / CV</text><text class="m" x="164" y="134" font-size="15">TensorFlow · OpenCV</text></g>
  <g class="rise" style="animation-delay:0.42000000000000004s"><text class="m" x="48" y="168" font-size="11" letter-spacing="2.5">MOBILE</text><text class="m" x="164" y="168" font-size="15">Flutter</text></g>
  <g class="rise" style="animation-delay:0.5s"><text class="m" x="48" y="202" font-size="11" letter-spacing="2.5">TOOLING</text><text class="m" x="164" y="202" font-size="15">Git</text></g>
</svg>
