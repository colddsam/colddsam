  <g clip-path="url(#type0)"><text class="m" x="48" y="104" font-size="30" letter-spacing="-0.5">Hi, I'm Samrat Kumar Das.</text></g>
  <g class="fade" style="animation-delay:1.425s"><text class="m" x="48" y="104" font-size="30" letter-spacing="-0.5"><tspan fill-opacity="0">Hi, I'm Samrat Kumar Das.</tspan><tspan class="caret"> █</tspan></text></g>
  <rect class="ink grow" style="animation-delay:1.43s" x="48" y="138" width="56" height="3"/>
  <g class="rise" style="animation-delay:1.2s"><text class="m" x="48" y="178" font-size="15">I'm from Kolkata, West Bengal, in the 4th year of my B.Tech</text></g>
  <g class="rise" style="animation-delay:1.2s"><text class="m" x="48" y="202" font-size="15">in Electronics and Communication Engineering.</text></g>
  <g class="rise" style="animation-delay:1.3199999999999998s"><text class="m" x="48" y="236" font-size="15">Currently I'm enhancing my skills in Machine Learning and</text></g>
  <g class="rise" style="animation-delay:1.3199999999999998s"><text class="m" x="48" y="260" font-size="15">Front-End Development, which I want to pursue further. I</text></g>
  <g class="rise" style="animation-delay:1.3199999999999998s"><text class="m" x="48" y="284" font-size="15">love to work as a team and collaborate on open source.</text></g>
  <g class="rise" style="animation-delay:1.44s"><text class="m" x="48" y="318" font-size="15">Now I'm looking for an internship to apply and sharpen the</text></g>
  <g class="rise" style="animation-delay:1.44s"><text class="m" x="48" y="342" font-size="15">skills I'm learning through my studies and personal</text></g>
  <g class="rise" style="animation-delay:1.44s"><text class="m" x="48" y="366" font-size="15">projects.</text></g>
  <rect class="ink growy" style="animation-delay:1.56s" x="48" y="390" width="3" height="78"/>
  <g class="fade" style="animation-delay:1.76s"><text class="m" x="70" y="408" font-size="10" letter-spacing="2.5" opacity="0.6">CREDO</text><text class="m" x="70" y="434" font-size="16">I believe nothing is impossible if you think it is</text><text class="m" x="70" y="458" font-size="16">possible.</text></g>
