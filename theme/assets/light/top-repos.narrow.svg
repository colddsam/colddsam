<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 302" width="400" height="302" fill="none" role="img" aria-label="Top repositories by commits">
  <style>
    .m{font-family:ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}
    text{fill:#000000}
    .ln{stroke:#000000;stroke-width:1;fill:none}
    .ink{fill:#000000}
    .stroke{stroke:#000000;fill:none}
    .outline{stroke:#000000}
    text.paper{fill:#FFFFFF}
    .pp{fill:#FFFFFF}
    .pop{transform-box:fill-box;transform-origin:center;opacity:0;animation:pop .5s cubic-bezier(.2,1.4,.4,1) forwards}
    @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
    .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .fade{opacity:0;animation:fade .7s ease forwards}
    @keyframes fade{to{opacity:1}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
    @keyframes ring{0%{transform:scale(.4);opacity:.8}80%,100%{transform:scale(2.6);opacity:0}}
    .grow{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes grow{to{transform:scaleX(1)}}
    .eq{transform-box:fill-box;transform-origin:bottom;animation:eq .9s ease-in-out infinite alternate}
    @keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 3.2s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .caret{animation:caret 1.1s steps(1) infinite}
    @keyframes caret{50%{fill-opacity:0}}
    .nudge{animation:nudge 1.6s ease-in-out infinite}
    @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
    @media (prefers-reduced-motion:reduce){.draw,.rise,.fade,.pulse,.ring,.grow,.eq,.spin,.blink,.caret,.nudge,.anim,.pop{animation:none}.draw{stroke-dashoffset:0}.rise,.fade,.pop{opacity:1}.grow{transform:none}.ring{opacity:0}}
  </style>
  <g class="fade" style="animation-delay:0.1s"><text class="m" x="16" y="28" font-size="11" letter-spacing="1.75">TOP REPOSITORIES — BY COMMITS</text><text class="m" x="384" y="28" font-size="11" letter-spacing="1.75" text-anchor="end">FIG. 10.2</text></g><line class="ln draw" x1="16" y1="40" x2="384" y2="40" pathLength="1" opacity="1" style="animation-delay:0.1s"/>
  <g class="rise" style="animation-delay:0.2s"><text class="m" x="16" y="80" font-size="11" letter-spacing="1.25">Nº 01</text><text class="m" x="60" y="80" font-size="14">POTD-solution-for-GFG</text><rect class="ink" opacity="0.15" x="60" y="90" width="324" height="6"/><rect class="ink grow" style="animation-delay:0.4s" x="60" y="90" width="324" height="6"/><text class="m" x="384" y="80" font-size="14" text-anchor="end">276</text></g>
  <g class="rise" style="animation-delay:0.28s"><text class="m" x="16" y="128" font-size="11" letter-spacing="1.25">Nº 02</text><text class="m" x="60" y="128" font-size="14">POTD-solution-for-LeetCode</text><rect class="ink" opacity="0.15" x="60" y="138" width="324" height="6"/><rect class="ink grow" style="animation-delay:0.5s" x="60" y="138" width="212" height="6"/><text class="m" x="384" y="128" font-size="14" text-anchor="end">181</text></g>
  <g class="rise" style="animation-delay:0.36s"><text class="m" x="16" y="176" font-size="11" letter-spacing="1.25">Nº 03</text><text class="m" x="60" y="176" font-size="14">coldscout</text><rect class="ink" opacity="0.15" x="60" y="186" width="324" height="6"/><rect class="ink grow" style="animation-delay:0.6000000000000001s" x="60" y="186" width="204" height="6"/><text class="m" x="384" y="176" font-size="14" text-anchor="end">174</text></g>
  <g class="rise" style="animation-delay:0.44s"><text class="m" x="16" y="224" font-size="11" letter-spacing="1.25">Nº 04</text><text class="m" x="60" y="224" font-size="14">nextjsportfolio</text><rect class="ink" opacity="0.15" x="60" y="234" width="324" height="6"/><rect class="ink grow" style="animation-delay:0.7000000000000001s" x="60" y="234" width="54" height="6"/><text class="m" x="384" y="224" font-size="14" text-anchor="end">46</text></g>
  <g class="rise" style="animation-delay:0.52s"><text class="m" x="16" y="272" font-size="11" letter-spacing="1.25">Nº 05</text><text class="m" x="60" y="272" font-size="14">portfolio</text><rect class="ink" opacity="0.15" x="60" y="282" width="324" height="6"/><rect class="ink grow" style="animation-delay:0.8s" x="60" y="282" width="29" height="6"/><text class="m" x="384" y="272" font-size="14" text-anchor="end">25</text></g>
</svg>
