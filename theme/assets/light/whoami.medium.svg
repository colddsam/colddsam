  <g class="rise" style="animation-delay:1.3199999999999998s"><text class="m" x="28" y="222" font-size="15">Currently I'm enhancing my skills in Machine Learning and</text></g>
  <g class="rise" style="animation-delay:1.3199999999999998s"><text class="m" x="28" y="246" font-size="15">Front-End Development, which I want to pursue further. I love to</text></g>
  <g class="rise" style="animation-delay:1.3199999999999998s"><text class="m" x="28" y="270" font-size="15">work as a team and collaborate on open source.</text></g>
  <g class="rise" style="animation-delay:1.44s"><text class="m" x="28" y="304" font-size="15">Now I'm looking for an internship to apply and sharpen the</text></g>
  <g class="rise" style="animation-delay:1.44s"><text class="m" x="28" y="328" font-size="15">skills I'm learning through my studies and personal projects.</text></g>
  <rect class="ink growy" style="animation-delay:1.56s" x="28" y="352" width="3" height="78"/>
