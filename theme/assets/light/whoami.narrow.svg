  <g clip-path="url(#type0)"><text class="m" x="16" y="96" font-size="24" letter-spacing="-0.25">Hi, I'm Samrat Kumar Das.</text></g>
  <g class="fade" style="animation-delay:1.425s"><text class="m" x="16" y="96" font-size="24" letter-spacing="-0.25"><tspan fill-opacity="0">Hi, I'm Samrat Kumar Das.</tspan><tspan class="caret"> █</tspan></text></g>
