  <g class="rise" style="animation-delay:1.3199999999999998s"><text class="m" x="16" y="270" font-size="15">Machine Learning and Front-End</text></g>
  <g class="rise" style="animation-delay:1.3199999999999998s"><text class="m" x="16" y="294" font-size="15">Development, which I want to pursue</text></g>
  <g class="rise" style="animation-delay:1.3199999999999998s"><text class="m" x="16" y="318" font-size="15">further. I love to work as a team and</text></g>
  <g class="rise" style="animation-delay:1.3199999999999998s"><text class="m" x="16" y="342" font-size="15">collaborate on open source.</text></g>
  <g class="rise" style="animation-delay:1.44s"><text class="m" x="16" y="376" font-size="15">Now I'm looking for an internship to</text></g>
  <g class="rise" style="animation-delay:1.44s"><text class="m" x="16" y="400" font-size="15">apply and sharpen the skills I'm</text></g>
  <g class="rise" style="animation-delay:1.44s"><text class="m" x="16" y="424" font-size="15">learning through my studies and personal</text></g>
  <g class="rise" style="animation-delay:1.44s"><text class="m" x="16" y="448" font-size="15">projects.</text></g>
  <rect class="ink growy" style="animation-delay:1.56s" x="16" y="472" width="3" height="78"/>
  <g class="fade" style="animation-delay:1.76s"><text class="m" x="38" y="490" font-size="10" letter-spacing="1.25" opacity="0.6">CREDO</text><text class="m" x="38" y="516" font-size="16">I believe nothing is impossible if</text><text class="m" x="38" y="540" font-size="16">you think it is possible.</text></g>
