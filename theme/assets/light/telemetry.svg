  <g class="rise" style="animation-delay:0.28s"><text class="m" x="274" y="76" font-size="11" letter-spacing="2.5">CURRENT STREAK</text><text class="m" x="274" y="108" font-size="26">0d</text></g>
  <g class="rise" style="animation-delay:0.36s"><text class="m" x="500" y="76" font-size="11" letter-spacing="2.5">LONGEST STREAK</text><text class="m" x="500" y="108" font-size="26">8d</text></g>
  <g class="rise" style="animation-delay:0.44s"><text class="m" x="726" y="76" font-size="11" letter-spacing="2.5">BEST DAY</text><text class="m" x="726" y="108" font-size="18">15 · 09 MAY 2026</text></g>
