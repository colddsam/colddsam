<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1325" width="640" height="1325" fill="none" role="img" aria-label="Featured projects">
  <style>
    .m{font-family:ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}
    text{fill:#000000}
    .ln{stroke:#000000;stroke-width:1;fill:none}
    .ink{fill:#000000}
    .stroke{stroke:#000000;fill:none}
    .outline{stroke:#000000}
    text.paper{fill:#FFFFFF}
    .pp{fill:#FFFFFF}
    .pop{transform-box:fill-box;transform-origin:center;opacity:0;animation:pop .5s cubic-bezier(.2,1.4,.4,1) forwards}
    @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
    .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .fade{opacity:0;animation:fade .7s ease forwards}
    @keyframes fade{to{opacity:1}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
    @keyframes ring{0%{transform:scale(.4);opacity:.8}80%,100%{transform:scale(2.6);opacity:0}}
    .grow{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes grow{to{transform:scaleX(1)}}
    .eq{transform-box:fill-box;transform-origin:bottom;animation:eq .9s ease-in-out infinite alternate}
    @keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 3.2s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .caret{animation:caret 1.1s steps(1) infinite}
    @keyframes caret{50%{fill-opacity:0}}
    .nudge{animation:nudge 1.6s ease-in-out infinite}
    @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
    @media (prefers-reduced-motion:reduce){.draw,.rise,.fade,.pulse,.ring,.grow,.eq,.spin,.blink,.caret,.nudge,.anim,.pop{animation:none}.draw{stroke-dashoffset:0}.rise,.fade,.pop{opacity:1}.grow{transform:none}.ring{opacity:0}}
  </style>
  <g class="fade" style="animation-delay:0.1s"><text class="m" x="28" y="28" font-size="11" letter-spacing="1.75">SELECTED WORK — LIVE FROM GITHUB</text><text class="m" x="612" y="28" font-size="11" letter-spacing="1.75" text-anchor="end">FIG. 04.1</text></g><line class="ln draw" x1="28" y1="40" x2="612" y2="40" pathLength="1" opacity="1" style="animation-delay:0.1s"/>
  <g class="rise" style="animation-delay:0.2s"><text class="m" x="28" y="82" font-size="11" letter-spacing="1.25">Nº 01</text><rect class="ink pulse" x="77.25" y="69" width="40" height="17"/><text class="m paper" x="98.25" y="81.5" font-size="10" letter-spacing="1" text-anchor="middle">NEW</text><text class="m" x="612" y="82" font-size="11" letter-spacing="1" text-anchor="end">★ 0  ·  1 FORKS</text><text class="m" x="28" y="118" font-size="24" letter-spacing="-0.25">do whatever you like</text><text class="m" x="28" y="148" font-size="14">Full-stack media, document &amp; utility toolkit built with Next.js 16</text><text class="m" x="28" y="169" font-size="14">and FastAPI — download YouTube/Instagram/Facebook media, extract MP3</text><text class="m" x="28" y="190" font-size="14">audio from video, merge/split/compress PDFs, and generate custom QR…</text><text class="m" x="28" y="221" font-size="10" letter-spacing="1" opacity="0.6">TYPESCRIPT · ALL-IN-ONE · FASTAPI · NEXTJS</text><line class="ln" x1="28" y1="235" x2="612" y2="235" opacity="0.25"/><text class="m" x="28" y="255" font-size="10" letter-spacing="1">UPDATED NOV 2026</text><text class="m" x="612" y="255" font-size="10" letter-spacing="1" text-anchor="end">LIVE DEMO ↗</text></g>
  <line class="ln" x1="28" y1="281" x2="612" y2="281" opacity="0.25"/>
  <g class="rise" style="animation-delay:0.30000000000000004s"><text class="m" x="28" y="315" font-size="11" letter-spacing="1.25">Nº 02</text><text class="m" x="612" y="315" font-size="11" letter-spacing="1" text-anchor="end">★ 3  ·  0 FORKS</text><text class="m" x="28" y="351" font-size="24" letter-spacing="-0.25">Cold Scout</text><text class="m" x="28" y="381" font-size="14">Autonomous B2B lead generation: finds businesses on Google Places,</text><text class="m" x="28" y="402" font-size="14">qualifies them with Llama 3 and runs personalised email campaigns.</text><text class="m" x="28" y="433" font-size="10" letter-spacing="1" opacity="0.6">FASTAPI · REACT 19 · POSTGRESQL · REDIS · RAZORPAY</text><line class="ln" x1="28" y1="447" x2="612" y2="447" opacity="0.25"/><text class="m" x="28" y="467" font-size="10" letter-spacing="1">UPDATED AUG 2026</text><text class="m" x="612" y="467" font-size="10" letter-spacing="1" text-anchor="end">LIVE DEMO ↗</text></g>
  <line class="ln" x1="28" y1="493" x2="612" y2="493" opacity="0.25"/>
  <g class="rise" style="animation-delay:0.4s"><text class="m" x="28" y="527" font-size="11" letter-spacing="1.25">Nº 03</text><text class="m" x="612" y="527" font-size="11" letter-spacing="1" text-anchor="end">★ 2  ·  2 FORKS</text><text class="m" x="28" y="563" font-size="24" letter-spacing="-0.25">Truth Guardian</text><text class="m" x="28" y="593" font-size="14">AI fake-news detection for text, images and social posts with</text><text class="m" x="28" y="614" font-size="14">explainable results, a web app and a Chrome extension.</text><text class="m" x="28" y="645" font-size="10" letter-spacing="1" opacity="0.6">GEMINI · FASTAPI · NEXT.JS · STREAMLIT</text><line class="ln" x1="28" y1="659" x2="612" y2="659" opacity="0.25"/><text class="m" x="28" y="679" font-size="10" letter-spacing="1">UPDATED MAY 2026</text><text class="m" x="612" y="679" font-size="10" letter-spacing="1" text-anchor="end">LIVE DEMO ↗</text></g>
  <line class="ln" x1="28" y1="705" x2="612" y2="705" opacity="0.25"/>
  <g class="rise" style="animation-delay:0.5s"><text class="m" x="28" y="739" font-size="11" letter-spacing="1.25">Nº 04</text><text class="m" x="612" y="739" font-size="11" letter-spacing="1" text-anchor="end">★ 0  ·  0 FORKS</text><text class="m" x="28" y="775" font-size="24" letter-spacing="-0.25">Sketchbook</text><text class="m" x="28" y="805" font-size="14">Part digital sketchbook, part professional portfolio — hand-drawn</text><text class="m" x="28" y="826" font-size="14">feel with smooth motion.</text><text class="m" x="28" y="857" font-size="10" letter-spacing="1" opacity="0.6">NEXT.JS · FRAMER MOTION · TYPESCRIPT</text><line class="ln" x1="28" y1="871" x2="612" y2="871" opacity="0.25"/><text class="m" x="28" y="891" font-size="10" letter-spacing="1">UPDATED APR 2026</text><text class="m" x="612" y="891" font-size="10" letter-spacing="1" text-anchor="end">LIVE DEMO ↗</text></g>
  <line class="ln" x1="28" y1="917" x2="612" y2="917" opacity="0.25"/>
  <g class="rise" style="animation-delay:0.6000000000000001s"><text class="m" x="28" y="951" font-size="11" letter-spacing="1.25">Nº 05</text><text class="m" x="612" y="951" font-size="11" letter-spacing="1" text-anchor="end">★ 0  ·  3 FORKS</text><text class="m" x="28" y="987" font-size="24" letter-spacing="-0.25">Device Fault detection</text><text class="m" x="28" y="1017" font-size="14">One Wire device connection and alert system using SMTP server</text><text class="m" x="28" y="1048" font-size="10" letter-spacing="1" opacity="0.6">C++</text><line class="ln" x1="28" y1="1062" x2="612" y2="1062" opacity="0.25"/><text class="m" x="28" y="1082" font-size="10" letter-spacing="1">UPDATED APR 2025</text><text class="m" x="612" y="1082" font-size="10" letter-spacing="1" text-anchor="end">SOURCE ↗</text></g>
