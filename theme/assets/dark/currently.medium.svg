<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 606" width="640" height="606" fill="none" role="img" aria-label="What Samrat is building, learning and open to right now">
  <style>
    .m{font-family:ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}
    text{fill:#FFFFFF}
    .ln{stroke:#FFFFFF;stroke-width:1;fill:none}
    .ink{fill:#FFFFFF}
    .stroke{stroke:#FFFFFF;fill:none}
    .outline{stroke:#FFFFFF}
    text.paper{fill:#0D1117}
    .pp{fill:#0D1117}
    .pop{transform-box:fill-box;transform-origin:center;opacity:0;animation:pop .5s cubic-bezier(.2,1.4,.4,1) forwards}
    @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
    .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .fade{opacity:0;animation:fade .7s ease forwards}
    @keyframes fade{to{opacity:1}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
    @keyframes ring{0%{transform:scale(.4);opacity:.8}80%,100%{transform:scale(2.6);opacity:0}}
    .grow{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes grow{to{transform:scaleX(1)}}
    .eq{transform-box:fill-box;transform-origin:bottom;animation:eq .9s ease-in-out infinite alternate}
    @keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 3.2s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .caret{animation:caret 1.1s steps(1) infinite}
    @keyframes caret{50%{fill-opacity:0}}
    .nudge{animation:nudge 1.6s ease-in-out infinite}
    @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
    @media (prefers-reduced-motion:reduce){.draw,.rise,.fade,.pulse,.ring,.grow,.eq,.spin,.blink,.caret,.nudge,.anim,.pop{animation:none}.draw{stroke-dashoffset:0}.rise,.fade,.pop{opacity:1}.grow{transform:none}.ring{opacity:0}}
  </style>
  <g class="fade" style="animation-delay:0.1s"><text class="m" x="28" y="28" font-size="11" letter-spacing="1.75">WHAT I'M DOING NOW</text><text class="m" x="612" y="28" font-size="11" letter-spacing="1.75" text-anchor="end">FIG. 03.1 · UPDATED OCT 2026</text></g><line class="ln draw" x1="28" y1="40" x2="612" y2="40" pathLength="1" opacity="1" style="animation-delay:0.1s"/>
  <g class="rise" style="animation-delay:0.2s"><text class="m" x="28" y="84" font-size="11" letter-spacing="1.25" opacity="0.6">01</text><text class="m" x="62" y="84" font-size="11" letter-spacing="1.5">BUILDING</text><text class="m" x="28" y="114" font-size="15">Cold Scout — an autonomous AI lead-generation SaaS that finds,</text><text class="m" x="28" y="136" font-size="15">qualifies and emails local businesses.</text><text class="m" x="28" y="160" font-size="10" letter-spacing="1" opacity="0.6">FASTAPI · REACT 19 · LLAMA 3 · POSTGRESQL</text></g>
  <line class="ln" x1="28" y1="198" x2="612" y2="198" opacity="0.25"/>
  <g class="rise" style="animation-delay:0.28s"><text class="m" x="28" y="224" font-size="11" letter-spacing="1.25" opacity="0.6">02</text><text class="m" x="62" y="224" font-size="11" letter-spacing="1.5">LEARNING</text><text class="m" x="28" y="254" font-size="15">LLM agents and retrieval pipelines, and shipping ML models to</text><text class="m" x="28" y="276" font-size="15">production.</text><text class="m" x="28" y="300" font-size="10" letter-spacing="1" opacity="0.6">AGENTS · RAG · MLOPS</text></g>
  <line class="ln" x1="28" y1="338" x2="612" y2="338" opacity="0.25"/>
  <g class="rise" style="animation-delay:0.36s"><text class="m" x="28" y="364" font-size="11" letter-spacing="1.25" opacity="0.6">03</text><text class="m" x="62" y="364" font-size="11" letter-spacing="1.5">EXPLORING</text><text class="m" x="28" y="394" font-size="15">Explainable AI for misinformation — scoring and sourcing claims</text><text class="m" x="28" y="416" font-size="15">in Truth Guardian.</text><text class="m" x="28" y="440" font-size="10" letter-spacing="1" opacity="0.6">GEMINI · NEXT.JS · CHROME EXTENSION</text></g>
  <line class="ln" x1="28" y1="478" x2="612" y2="478" opacity="0.25"/>
  <g class="rise" style="animation-delay:0.44s"><text class="m" x="28" y="504" font-size="11" letter-spacing="1.25" opacity="0.6">04</text><circle class="stroke ring" cx="66" cy="500" r="4"/><circle class="ink pulse" cx="66" cy="500" r="3"/><text class="m" x="78" y="504" font-size="11" letter-spacing="1.5">OPEN TO</text><text class="m" x="28" y="534" font-size="15">ML / full-stack internships, open-source collaboration and</text><text class="m" x="28" y="556" font-size="15">hackathon teams.</text><text class="m" x="28" y="580" font-size="10" letter-spacing="1" opacity="0.6">KOLKATA · REMOTE</text></g>
</svg>
