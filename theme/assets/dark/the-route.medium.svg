<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 624" width="640" height="624" fill="none" role="img" aria-label="Achievements">
  <style>
    .m{font-family:ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}
    text{fill:#FFFFFF}
    .ln{stroke:#FFFFFF;stroke-width:1;fill:none}
    .ink{fill:#FFFFFF}
    .stroke{stroke:#FFFFFF;fill:none}
    .outline{stroke:#FFFFFF}
    text.paper{fill:#0D1117}
    .pp{fill:#0D1117}
    .pop{transform-box:fill-box;transform-origin:center;opacity:0;animation:pop .5s cubic-bezier(.2,1.4,.4,1) forwards}
    @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
    .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .fade{opacity:0;animation:fade .7s ease forwards}
    @keyframes fade{to{opacity:1}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
    @keyframes ring{0%{transform:scale(.4);opacity:.8}80%,100%{transform:scale(2.6);opacity:0}}
    .grow{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes grow{to{transform:scaleX(1)}}
    .eq{transform-box:fill-box;transform-origin:bottom;animation:eq .9s ease-in-out infinite alternate}
    @keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 3.2s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .caret{animation:caret 1.1s steps(1) infinite}
    @keyframes caret{50%{fill-opacity:0}}
    .nudge{animation:nudge 1.6s ease-in-out infinite}
    @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
    @media (prefers-reduced-motion:reduce){.draw,.rise,.fade,.pulse,.ring,.grow,.eq,.spin,.blink,.caret,.nudge,.anim,.pop{animation:none}.draw{stroke-dashoffset:0}.rise,.fade,.pop{opacity:1}.grow{transform:none}.ring{opacity:0}}
  </style>
  <g class="fade" style="animation-delay:0.1s"><text class="m" x="28" y="28" font-size="11" letter-spacing="1.75">ACHIEVEMENTS SO FAR</text><text class="m" x="612" y="28" font-size="11" letter-spacing="1.75" text-anchor="end">FIG. 12.1</text></g><line class="ln draw" x1="28" y1="40" x2="612" y2="40" pathLength="1" opacity="1" style="animation-delay:0.1s"/>
  <line class="ln draw" x1="34" y1="75" x2="34" y2="547" pathLength="1" opacity="0.5" style="animation-delay:0.2s"/>
  <g class="rise" style="animation-delay:0.2s"><circle class="ink" cx="34" cy="75" r="4"/><text class="m" x="54" y="80" font-size="11" letter-spacing="1.25">Nº 01</text><text class="m" x="54" y="102" font-size="15">Appointed as Campus Ambassador of IIT Madras</text><text class="m" x="612" y="80" font-size="10" letter-spacing="1" text-anchor="end">LINK ↗</text></g>
  <g class="rise" style="animation-delay:0.30000000000000004s"><circle class="ink" cx="34" cy="139" r="4"/><text class="m" x="54" y="144" font-size="11" letter-spacing="1.25">Nº 02</text><text class="m" x="54" y="166" font-size="15">Finished at 2nd position in the Entrepreneurship Awareness</text><text class="m" x="54" y="188" font-size="15">Camp</text></g>
  <g class="rise" style="animation-delay:0.4s"><circle class="ink" cx="34" cy="225" r="4"/><text class="m" x="54" y="230" font-size="11" letter-spacing="1.25">Nº 03</text><text class="m" x="54" y="252" font-size="15">Successfully completed Career Essentials in Software</text><text class="m" x="54" y="274" font-size="15">Development by Microsoft and LinkedIn</text><text class="m" x="612" y="230" font-size="10" letter-spacing="1" text-anchor="end">LINK ↗</text></g>
  <g class="rise" style="animation-delay:0.5s"><circle class="ink" cx="34" cy="311" r="4"/><text class="m" x="54" y="316" font-size="11" letter-spacing="1.25">Nº 04</text><text class="m" x="54" y="338" font-size="15">Participated in the House of Hackers Hackathon organized by</text><text class="m" x="54" y="360" font-size="15">IIIT Ranchi</text><text class="m" x="612" y="316" font-size="10" letter-spacing="1" text-anchor="end">LINK ↗</text></g>
  <g class="rise" style="animation-delay:0.6000000000000001s"><circle class="ink" cx="34" cy="397" r="4"/><text class="m" x="54" y="402" font-size="11" letter-spacing="1.25">Nº 05</text><text class="m" x="54" y="424" font-size="15">In 2023, participated in Hack4Bengal 2.0 — one of the biggest</text><text class="m" x="54" y="446" font-size="15">privately run hackathons</text></g>
  <g class="rise" style="animation-delay:0.7s"><circle class="ink" cx="34" cy="483" r="4"/><text class="m" x="54" y="488" font-size="11" letter-spacing="1.25">Nº 06</text><text class="m" x="54" y="510" font-size="15">Joined GDG Durgapur as a Graphics Designer for the core team</text></g>
  <g class="rise" style="animation-delay:0.8s"><circle class="stroke ring" cx="34" cy="547" r="5"/><circle class="ink pulse" cx="34" cy="547" r="4"/><text class="m" x="54" y="552" font-size="11" letter-spacing="1.25">Nº 07</text><text class="m" x="54" y="574" font-size="15">Started 2024 by joining Hack4Bengal 3.0 as a core Graphics</text><text class="m" x="54" y="596" font-size="15">Designer</text></g>
</svg>
