<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 232" width="1000" height="232" fill="none" role="img" aria-label="Last played on Spotify: Afsos — Anuv Jain, AP Dhillon">
  <style>
    .m{font-family:ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}
    text{fill:#FFFFFF}
    .ln{stroke:#FFFFFF;stroke-width:1;fill:none}
    .ink{fill:#FFFFFF}
    .stroke{stroke:#FFFFFF;fill:none}
    .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .fade{opacity:0;animation:fade .7s ease forwards}
    @keyframes fade{to{opacity:1}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
    @keyframes ring{0%{transform:scale(.4);opacity:.8}80%,100%{transform:scale(2.6);opacity:0}}
    .grow{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes grow{to{transform:scaleX(1)}}
    .eq{transform-box:fill-box;transform-origin:bottom;animation:eq .9s ease-in-out infinite alternate}
    @keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 3.2s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){.draw,.rise,.fade,.pulse,.ring,.grow,.eq,.spin{animation:none}.draw{stroke-dashoffset:0}.rise,.fade{opacity:1}.grow{transform:none}.ring{opacity:0}}
  </style>
  <g class="fade" style="animation-delay:0.1s"><text class="m" x="48" y="28" font-size="11" letter-spacing="3.5">NOW PLAYING — SPOTIFY</text><text class="m" x="952" y="28" font-size="11" letter-spacing="3.5" text-anchor="end">FIG. 08.1</text></g><line class="ln draw" x1="48" y1="40" x2="952" y2="40" pathLength="1" opacity="1" style="animation-delay:0.1s"/>
  <filter id="mono"><feColorMatrix type="saturate" values="0"/></filter>
  <g class="fade" style="animation-delay:0.2s"><image href="data:image/jpeg;base64," x="48" y="64" width="136" height="136" preserveAspectRatio="xMidYMid slice" filter="url(#mono)"/><rect class="stroke" x="48.5" y="64.5" width="135" height="135"/></g>
  <g class="fade" style="animation-delay:0.3s"><text class="m" x="216" y="82" font-size="11" letter-spacing="3">LAST PLAYED · 18 OCT 2026 · 15:23 IST</text></g>
  <g class="rise" style="animation-delay:0.4s"><text class="m" x="216" y="122" font-size="28" letter-spacing="-0.5">Afsos</text></g>
  <g class="rise" style="animation-delay:0.5s"><text class="m" x="216" y="150" font-size="15">Anuv Jain, AP Dhillon</text></g>
  <g class="fade" style="animation-delay:0.6s"><text class="m" x="216" y="174" font-size="11" letter-spacing="2.5" opacity="0.6">AFSOS</text></g>
  <line class="ln draw" x1="216" y1="191" x2="952" y2="191" pathLength="1" opacity="0.5" style="animation-delay:0.6s"/>
  <g class="fade" style="animation-delay:0.8s"><text class="m" x="952" y="210" font-size="10" letter-spacing="2" text-anchor="end">3:11</text></g>
