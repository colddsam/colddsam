<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 804" width="400" height="804" fill="none" role="img" aria-label="About Samrat Kumar Das">
  <style>
    .m{font-family:ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}
    text{fill:#FFFFFF}
    .ln{stroke:#FFFFFF;stroke-width:1;fill:none}
    .ink{fill:#FFFFFF}
    .stroke{stroke:#FFFFFF;fill:none}
    .outline{stroke:#FFFFFF}
    text.paper{fill:#0D1117}
    .pop{transform-box:fill-box;transform-origin:center;opacity:0;animation:pop .5s cubic-bezier(.2,1.4,.4,1) forwards}
    @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
    .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .fade{opacity:0;animation:fade .7s ease forwards}
    @keyframes fade{to{opacity:1}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
    @keyframes ring{0%{transform:scale(.4);opacity:.8}80%,100%{transform:scale(2.6);opacity:0}}
    .grow{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes grow{to{transform:scaleX(1)}}
    .eq{transform-box:fill-box;transform-origin:bottom;animation:eq .9s ease-in-out infinite alternate}
    @keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 3.2s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .caret{animation:caret 1.1s steps(1) infinite}
    @keyframes caret{50%{fill-opacity:0}}
    .nudge{animation:nudge 1.6s ease-in-out infinite}
    @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
    @media (prefers-reduced-motion:reduce){.draw,.rise,.fade,.pulse,.ring,.grow,.eq,.spin,.blink,.caret,.nudge,.anim,.pop{animation:none}.draw{stroke-dashoffset:0}.rise,.fade,.pop{opacity:1}.grow{transform:none}.ring{opacity:0}}
  </style>
  <g class="rise" style="animation-delay:0.1s"><text class="m" x="16" y="32" font-size="16">Hi, I'm Samrat Kumar Das from Kolkata,</text></g>
  <g class="rise" style="animation-delay:0.1s"><text class="m" x="16" y="58" font-size="16">West Bengal.</text></g>
  <g class="rise" style="animation-delay:0.18s"><text class="m" x="16" y="90" font-size="15">I'm in the 4th year of my B.Tech in</text></g>
  <g class="rise" style="animation-delay:0.18s"><text class="m" x="16" y="116" font-size="15">Electronics and Communication</text></g>
  <g class="rise" style="animation-delay:0.18s"><text class="m" x="16" y="142" font-size="15">Engineering, which I'm pursuing at</text></g>
  <g class="rise" style="animation-delay:0.18s"><text class="m" x="16" y="168" font-size="15">Narula Institute of Technology.</text></g>
  <g class="rise" style="animation-delay:0.26s"><text class="m" x="16" y="200" font-size="15">I believe nothing is impossible if you</text></g>
  <g class="rise" style="animation-delay:0.26s"><text class="m" x="16" y="226" font-size="15">think it is possible.</text></g>
  <g class="rise" style="animation-delay:0.34s"><text class="m" x="16" y="258" font-size="15">Currently I'm enhancing my skills in</text></g>
  <g class="rise" style="animation-delay:0.34s"><text class="m" x="16" y="284" font-size="15">Machine Learning and Front-End</text></g>
  <g class="rise" style="animation-delay:0.34s"><text class="m" x="16" y="310" font-size="15">Development, which I want to pursue</text></g>
  <g class="rise" style="animation-delay:0.34s"><text class="m" x="16" y="336" font-size="15">further. I love to work as a team and</text></g>
  <g class="rise" style="animation-delay:0.34s"><text class="m" x="16" y="362" font-size="15">collaborate on open source.</text></g>
  <g class="rise" style="animation-delay:0.42000000000000004s"><text class="m" x="16" y="394" font-size="15">Now I'm looking for an internship to</text></g>
  <g class="rise" style="animation-delay:0.42000000000000004s"><text class="m" x="16" y="420" font-size="15">apply and sharpen the skills I'm</text></g>
  <g class="rise" style="animation-delay:0.42000000000000004s"><text class="m" x="16" y="446" font-size="15">learning from my college and from my</text></g>
  <g class="rise" style="animation-delay:0.42000000000000004s"><text class="m" x="16" y="472" font-size="15">personal work.</text></g>
  <line class="ln draw" x1="16" y1="500" x2="384" y2="500" pathLength="1" opacity="0.5" style="animation-delay:0.5s"/>
  <g class="rise" style="animation-delay:0.5s"><text class="m" x="16" y="536" font-size="11" letter-spacing="1.25" opacity="0.7">BASED</text><text class="m" x="16" y="558" font-size="15">Kolkata, West Bengal, India</text></g>
  <g class="rise" style="animation-delay:0.58s"><text class="m" x="16" y="596" font-size="11" letter-spacing="1.25" opacity="0.7">STUDY</text><text class="m" x="16" y="618" font-size="15">B.Tech ECE · Narula Institute of</text><text class="m" x="16" y="640" font-size="15">Technology · 4th year</text></g>
  <g class="rise" style="animation-delay:0.6599999999999999s"><text class="m" x="16" y="678" font-size="11" letter-spacing="1.25" opacity="0.7">FOCUS</text><text class="m" x="16" y="700" font-size="15">Machine Learning · Front-End Development</text></g>
  <g class="rise" style="animation-delay:0.7399999999999999s"><text class="m" x="16" y="738" font-size="11" letter-spacing="1.25" opacity="0.7">STATUS</text><text class="m" x="16" y="760" font-size="15">looking for an internship · team work ·</text><text class="m" x="16" y="782" font-size="15">open-source collaboration</text></g>
</svg>
