<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 498" width="1000" height="498" fill="none" role="img" aria-label="Featured projects">
  <style>
    .m{font-family:ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}
    text{fill:#FFFFFF}
    .ln{stroke:#FFFFFF;stroke-width:1;fill:none}
    .ink{fill:#FFFFFF}
    .stroke{stroke:#FFFFFF;fill:none}
    .outline{stroke:#FFFFFF}
    text.paper{fill:#0D1117}
    .pp{fill:#0D1117}
    .pop{transform-box:fill-box;transform-origin:center;opacity:0;animation:pop .5s cubic-bezier(.2,1.4,.4,1) forwards}
    @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
    .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .fade{opacity:0;animation:fade .7s ease forwards}
    @keyframes fade{to{opacity:1}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
    @keyframes ring{0%{transform:scale(.4);opacity:.8}80%,100%{transform:scale(2.6);opacity:0}}
    .grow{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes grow{to{transform:scaleX(1)}}
    .eq{transform-box:fill-box;transform-origin:bottom;animation:eq .9s ease-in-out infinite alternate}
    @keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 3.2s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .caret{animation:caret 1.1s steps(1) infinite}
    @keyframes caret{50%{fill-opacity:0}}
    .nudge{animation:nudge 1.6s ease-in-out infinite}
    @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
    @media (prefers-reduced-motion:reduce){.draw,.rise,.fade,.pulse,.ring,.grow,.eq,.spin,.blink,.caret,.nudge,.anim,.pop{animation:none}.draw{stroke-dashoffset:0}.rise,.fade,.pop{opacity:1}.grow{transform:none}.ring{opacity:0}}
  </style>
  <g class="fade" style="animation-delay:0.1s"><text class="m" x="48" y="28" font-size="11" letter-spacing="3.5">SELECTED WORK — LIVE FROM GITHUB</text><text class="m" x="952" y="28" font-size="11" letter-spacing="3.5" text-anchor="end">FIG. 04.1</text></g><line class="ln draw" x1="48" y1="40" x2="952" y2="40" pathLength="1" opacity="1" style="animation-delay:0.1s"/>
  <g class="rise" style="animation-delay:0.2s"><text class="m" x="48" y="82" font-size="11" letter-spacing="2.5">Nº 01</text><text class="m" x="476" y="82" font-size="11" letter-spacing="2" text-anchor="end">★ 3  ·  0 FORKS</text><text class="m" x="48" y="118" font-size="24" letter-spacing="-0.5">Cold Scout</text><text class="m" x="48" y="148" font-size="14">Autonomous B2B lead generation: finds businesses</text><text class="m" x="48" y="169" font-size="14">on Google Places, qualifies them with Llama 3 and</text><text class="m" x="48" y="190" font-size="14">runs personalised email campaigns.</text><text class="m" x="48" y="221" font-size="10" letter-spacing="2" opacity="0.6">FASTAPI · REACT 19 · POSTGRESQL · REDIS · RAZORPAY</text><line class="ln" x1="48" y1="235" x2="476" y2="235" opacity="0.25"/><text class="m" x="48" y="255" font-size="10" letter-spacing="2">UPDATED AUG 2026</text><text class="m" x="476" y="255" font-size="10" letter-spacing="2" text-anchor="end">LIVE DEMO ↗</text></g>
  <g class="rise" style="animation-delay:0.30000000000000004s"><text class="m" x="524" y="82" font-size="11" letter-spacing="2.5">Nº 02</text><text class="m" x="952" y="82" font-size="11" letter-spacing="2" text-anchor="end">★ 2  ·  2 FORKS</text><text class="m" x="524" y="118" font-size="24" letter-spacing="-0.5">Truth Guardian</text><text class="m" x="524" y="148" font-size="14">AI fake-news detection for text, images and social</text><text class="m" x="524" y="169" font-size="14">posts with explainable results, a web app and a</text><text class="m" x="524" y="190" font-size="14">Chrome extension.</text><text class="m" x="524" y="221" font-size="10" letter-spacing="2" opacity="0.6">GEMINI · FASTAPI · NEXT.JS · STREAMLIT</text><line class="ln" x1="524" y1="235" x2="952" y2="235" opacity="0.25"/><text class="m" x="524" y="255" font-size="10" letter-spacing="2">UPDATED MAY 2026</text><text class="m" x="952" y="255" font-size="10" letter-spacing="2" text-anchor="end">LIVE DEMO ↗</text></g>
  <line class="ln" x1="500" y1="70" x2="500" y2="255" opacity="0.25"/>
  <line class="ln" x1="48" y1="281" x2="952" y2="281" opacity="0.25"/>
  <g class="rise" style="animation-delay:0.4s"><text class="m" x="48" y="315" font-size="11" letter-spacing="2.5">Nº 03</text><text class="m" x="476" y="315" font-size="11" letter-spacing="2" text-anchor="end">★ 0  ·  0 FORKS</text><text class="m" x="48" y="351" font-size="24" letter-spacing="-0.5">ModeYOLO</text><text class="m" x="48" y="381" font-size="14">Python package for colour-space transforms and</text><text class="m" x="48" y="402" font-size="14">building modified datasets for deep-learning</text><text class="m" x="48" y="423" font-size="14">training.</text><text class="m" x="48" y="454" font-size="10" letter-spacing="2" opacity="0.6">PYTHON · OPENCV · PYPI</text><line class="ln" x1="48" y1="468" x2="476" y2="468" opacity="0.25"/><text class="m" x="48" y="488" font-size="10" letter-spacing="2">UPDATED MAR 2024</text><text class="m" x="476" y="488" font-size="10" letter-spacing="2" text-anchor="end">SOURCE ↗</text></g>
  <g class="rise" style="animation-delay:0.5s"><text class="m" x="524" y="315" font-size="11" letter-spacing="2.5">Nº 04</text><text class="m" x="952" y="315" font-size="11" letter-spacing="2" text-anchor="end">★ 0  ·  0 FORKS</text><text class="m" x="524" y="351" font-size="24" letter-spacing="-0.5">Sketchbook</text><text class="m" x="524" y="381" font-size="14">Part digital sketchbook, part professional</text><text class="m" x="524" y="402" font-size="14">portfolio — hand-drawn feel with smooth motion.</text><text class="m" x="524" y="454" font-size="10" letter-spacing="2" opacity="0.6">NEXT.JS · FRAMER MOTION · TYPESCRIPT</text><line class="ln" x1="524" y1="468" x2="952" y2="468" opacity="0.25"/><text class="m" x="524" y="488" font-size="10" letter-spacing="2">UPDATED APR 2026</text><text class="m" x="952" y="488" font-size="10" letter-spacing="2" text-anchor="end">LIVE DEMO ↗</text></g>
  <line class="ln" x1="500" y1="303" x2="500" y2="488" opacity="0.25"/>
</svg>
