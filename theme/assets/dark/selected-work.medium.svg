  <line class="ln" x1="28" y1="260" x2="612" y2="260" opacity="0.25"/>
  <g class="rise" style="animation-delay:0.30000000000000004s"><text class="m" x="28" y="294" font-size="11" letter-spacing="1.25">Nº 02</text><text class="m" x="612" y="294" font-size="11" letter-spacing="1" text-anchor="end">★ 2  ·  2 FORKS</text><text class="m" x="28" y="330" font-size="24" letter-spacing="-0.25">Truth Guardian</text><text class="m" x="28" y="360" font-size="14">AI fake-news detection for text, images and social posts with</text><text class="m" x="28" y="381" font-size="14">explainable results, a web app and a Chrome extension.</text><text class="m" x="28" y="412" font-size="10" letter-spacing="1" opacity="0.6">GEMINI · FASTAPI · NEXT.JS · STREAMLIT</text><line class="ln" x1="28" y1="426" x2="612" y2="426" opacity="0.25"/><text class="m" x="28" y="446" font-size="10" letter-spacing="1">UPDATED MAY 2026</text><text class="m" x="612" y="446" font-size="10" letter-spacing="1" text-anchor="end">LIVE DEMO ↗</text></g>
  <line class="ln" x1="28" y1="472" x2="612" y2="472" opacity="0.25"/>
  <g class="rise" style="animation-delay:0.4s"><text class="m" x="28" y="506" font-size="11" letter-spacing="1.25">Nº 03</text><text class="m" x="612" y="506" font-size="11" letter-spacing="1" text-anchor="end">★ 0  ·  0 FORKS</text><text class="m" x="28" y="542" font-size="24" letter-spacing="-0.25">ModeYOLO</text><text class="m" x="28" y="572" font-size="14">Python package for colour-space transforms and building modified</text><text class="m" x="28" y="593" font-size="14">datasets for deep-learning training.</text><text class="m" x="28" y="624" font-size="10" letter-spacing="1" opacity="0.6">PYTHON · OPENCV · PYPI</text><line class="ln" x1="28" y1="638" x2="612" y2="638" opacity="0.25"/><text class="m" x="28" y="658" font-size="10" letter-spacing="1">UPDATED MAR 2024</text><text class="m" x="612" y="658" font-size="10" letter-spacing="1" text-anchor="end">SOURCE ↗</text></g>
  <line class="ln" x1="28" y1="684" x2="612" y2="684" opacity="0.25"/>
  <g class="rise" style="animation-delay:0.5s"><text class="m" x="28" y="718" font-size="11" letter-spacing="1.25">Nº 04</text><text class="m" x="612" y="718" font-size="11" letter-spacing="1" text-anchor="end">★ 0  ·  0 FORKS</text><text class="m" x="28" y="754" font-size="24" letter-spacing="-0.25">Sketchbook</text><text class="m" x="28" y="784" font-size="14">Part digital sketchbook, part professional portfolio — hand-drawn</text><text class="m" x="28" y="805" font-size="14">feel with smooth motion.</text><text class="m" x="28" y="836" font-size="10" letter-spacing="1" opacity="0.6">NEXT.JS · FRAMER MOTION · TYPESCRIPT</text><line class="ln" x1="28" y1="850" x2="612" y2="850" opacity="0.25"/><text class="m" x="28" y="870" font-size="10" letter-spacing="1">UPDATED APR 2026</text><text class="m" x="612" y="870" font-size="10" letter-spacing="1" text-anchor="end">LIVE DEMO ↗</text></g>
</svg>
