  <line class="ln" x1="28" y1="854" x2="612" y2="854" opacity="0.25"/>
  <g class="rise" style="animation-delay:0.6000000000000001s"><text class="m" x="28" y="888" font-size="11" letter-spacing="1.25">Nº 05</text><text class="m" x="612" y="888" font-size="11" letter-spacing="1" text-anchor="end">★ 0  ·  3 FORKS</text><text class="m" x="28" y="924" font-size="24" letter-spacing="-0.25">Device Fault detection</text><text class="m" x="28" y="954" font-size="14">One Wire device connection and alert system using SMTP server</text><text class="m" x="28" y="985" font-size="10" letter-spacing="1" opacity="0.6">C++</text><line class="ln" x1="28" y1="999" x2="612" y2="999" opacity="0.25"/><text class="m" x="28" y="1019" font-size="10" letter-spacing="1">UPDATED APR 2025</text><text class="m" x="612" y="1019" font-size="10" letter-spacing="1" text-anchor="end">SOURCE ↗</text></g>
