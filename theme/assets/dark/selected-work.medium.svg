  <g class="rise" style="animation-delay:0.7s"><text class="m" x="28" y="1079" font-size="11" letter-spacing="1.25">Nº 06</text><text class="m" x="612" y="1079" font-size="11" letter-spacing="1" text-anchor="end">★ 1  ·  1 FORKS</text><text class="m" x="28" y="1115" font-size="24" letter-spacing="-0.25">virtual assistant</text><text class="m" x="28" y="1145" font-size="14">It is my first AI project on python. Here I try to create a Virtual</text><text class="m" x="28" y="1166" font-size="14">assistant to perform various tasks like web searching, youtube video</text><text class="m" x="28" y="1187" font-size="14">opening, whatsapp message and email sending. It also able to perform…</text><text class="m" x="28" y="1218" font-size="10" letter-spacing="1" opacity="0.6">PYTHON</text><line class="ln" x1="28" y1="1232" x2="612" y2="1232" opacity="0.25"/><text class="m" x="28" y="1252" font-size="10" letter-spacing="1">UPDATED JAN 2023</text><text class="m" x="612" y="1252" font-size="10" letter-spacing="1" text-anchor="end">SOURCE ↗</text></g>
