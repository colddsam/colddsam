<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" fill="none" role="img" aria-label="Samrat Kumar Das — ML Engineer &amp; Front-End Developer — Kolkata, India.">
  <style>
    .m{font-family:ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}
    text{fill:#FFFFFF}
    .ln{stroke:#FFFFFF;stroke-width:1;fill:none}
    .ink{fill:#FFFFFF}
    .stroke{stroke:#FFFFFF;fill:none}
    .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .fade{opacity:0;animation:fade .7s ease forwards}
    @keyframes fade{to{opacity:1}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
    @keyframes ring{0%{transform:scale(.4);opacity:.8}80%,100%{transform:scale(2.6);opacity:0}}
    .grow{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes grow{to{transform:scaleX(1)}}
    @media (prefers-reduced-motion:reduce){.draw,.rise,.fade,.pulse,.ring,.grow{animation:none}.draw{stroke-dashoffset:0}.rise,.fade{opacity:1}.grow{transform:none}.ring{opacity:0}}
  </style>
  <line class="ln draw" x1="48" y1="58" x2="952" y2="58" pathLength="1" opacity="1" style="animation-delay:0.2s"/>
  <g class="fade" style="animation-delay:0.2s"><text class="m" x="48" y="44" font-size="11" letter-spacing="3.5">PROFILE — INDEX Nº 001</text><text class="m" x="952" y="44" font-size="11" letter-spacing="3.5" text-anchor="end">KOLKATA, IN — 22.57° N</text></g>
  <g class="rise" style="animation-delay:0.5s"><text class="m" x="46" y="176" font-size="72" letter-spacing="-2">Samrat Kumar Das</text></g>
  <g class="fade" style="animation-delay:0.9s"><text class="m" x="48" y="214" font-size="19">ML Engineer &amp; Front-End Developer — Kolkata, India.</text></g>
  <g class="fade" style="animation-delay:1.2s"><text class="m" x="48" y="274" font-size="12.5" letter-spacing="1">focus  ▸</text><text class="m" x="140" y="274" font-size="12.5" letter-spacing="1">machine learning · front-end development · open source</text></g>
  <g class="fade" style="animation-delay:1.4s"><text class="m" x="48" y="300" font-size="12.5" letter-spacing="1">a passionate ML engineer looking for an opportunity to grab an internship.</text></g>
  <line class="ln draw" x1="48" y1="342" x2="952" y2="342" pathLength="1" opacity="1" style="animation-delay:1.4s"/>
  <g class="fade" style="animation-delay:1.7s"><text class="m" x="48" y="374" font-size="11.5" letter-spacing="3">AI / ML</text><text class="m" x="130.29999999999998" y="374" font-size="11.5" text-anchor="middle">·</text><text class="m" x="146.29999999999998" y="374" font-size="11.5" letter-spacing="3">FRONT END</text><text class="m" x="248.39999999999998" y="374" font-size="11.5" text-anchor="middle">·</text><text class="m" x="264.4" y="374" font-size="11.5" letter-spacing="3">DATA STRUCTURES</text><text class="m" x="952" y="374" font-size="11.5" letter-spacing="3" text-anchor="end">B.TECH ECE — NARULA INSTITUTE OF TECHNOLOGY</text></g>
</svg>
