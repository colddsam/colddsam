<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 964" width="400" height="964" fill="none" role="img" aria-label="Featured projects">
  <style>
    .m{font-family:ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}
    text{fill:#FFFFFF}
    .ln{stroke:#FFFFFF;stroke-width:1;fill:none}
    .ink{fill:#FFFFFF}
    .stroke{stroke:#FFFFFF;fill:none}
    .outline{stroke:#FFFFFF}
    text.paper{fill:#0D1117}
    .pp{fill:#0D1117}
    .pop{transform-box:fill-box;transform-origin:center;opacity:0;animation:pop .5s cubic-bezier(.2,1.4,.4,1) forwards}
    @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
    .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .fade{opacity:0;animation:fade .7s ease forwards}
    @keyframes fade{to{opacity:1}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
    @keyframes ring{0%{transform:scale(.4);opacity:.8}80%,100%{transform:scale(2.6);opacity:0}}
    .grow{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes grow{to{transform:scaleX(1)}}
    .eq{transform-box:fill-box;transform-origin:bottom;animation:eq .9s ease-in-out infinite alternate}
    @keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 3.2s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .caret{animation:caret 1.1s steps(1) infinite}
    @keyframes caret{50%{fill-opacity:0}}
    .nudge{animation:nudge 1.6s ease-in-out infinite}
    @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
    @media (prefers-reduced-motion:reduce){.draw,.rise,.fade,.pulse,.ring,.grow,.eq,.spin,.blink,.caret,.nudge,.anim,.pop{animation:none}.draw{stroke-dashoffset:0}.rise,.fade,.pop{opacity:1}.grow{transform:none}.ring{opacity:0}}
  </style>
  <g class="fade" style="animation-delay:0.1s"><text class="m" x="16" y="28" font-size="11" letter-spacing="1.75">SELECTED WORK — LIVE FROM GITHUB</text><text class="m" x="384" y="28" font-size="11" letter-spacing="1.75" text-anchor="end"></text></g><line class="ln draw" x1="16" y1="40" x2="384" y2="40" pathLength="1" opacity="1" style="animation-delay:0.1s"/>
  <g class="rise" style="animation-delay:0.2s"><text class="m" x="16" y="82" font-size="11" letter-spacing="1.25">Nº 01</text><text class="m" x="384" y="82" font-size="11" letter-spacing="1" text-anchor="end">★ 3  ·  0 FORKS</text><text class="m" x="16" y="118" font-size="24" letter-spacing="-0.25">Cold Scout</text><text class="m" x="16" y="148" font-size="14">Autonomous B2B lead generation: finds</text><text class="m" x="16" y="169" font-size="14">businesses on Google Places, qualifies them</text><text class="m" x="16" y="190" font-size="14">with Llama 3 and runs personalised email…</text><text class="m" x="16" y="221" font-size="10" letter-spacing="1" opacity="0.6">FASTAPI · REACT 19 · POSTGRESQL · REDIS · RAZORPAY</text><line class="ln" x1="16" y1="235" x2="384" y2="235" opacity="0.25"/><text class="m" x="16" y="255" font-size="10" letter-spacing="1">UPDATED AUG 2026</text><text class="m" x="384" y="255" font-size="10" letter-spacing="1" text-anchor="end">LIVE DEMO ↗</text></g>
  <line class="ln" x1="16" y1="281" x2="384" y2="281" opacity="0.25"/>
  <g class="rise" style="animation-delay:0.30000000000000004s"><text class="m" x="16" y="315" font-size="11" letter-spacing="1.25">Nº 02</text><text class="m" x="384" y="315" font-size="11" letter-spacing="1" text-anchor="end">★ 2  ·  2 FORKS</text><text class="m" x="16" y="351" font-size="24" letter-spacing="-0.25">Truth Guardian</text><text class="m" x="16" y="381" font-size="14">AI fake-news detection for text, images and</text><text class="m" x="16" y="402" font-size="14">social posts with explainable results, a</text><text class="m" x="16" y="423" font-size="14">web app and a Chrome extension.</text><text class="m" x="16" y="454" font-size="10" letter-spacing="1" opacity="0.6">GEMINI · FASTAPI · NEXT.JS · STREAMLIT</text><line class="ln" x1="16" y1="468" x2="384" y2="468" opacity="0.25"/><text class="m" x="16" y="488" font-size="10" letter-spacing="1">UPDATED MAY 2026</text><text class="m" x="384" y="488" font-size="10" letter-spacing="1" text-anchor="end">LIVE DEMO ↗</text></g>
  <line class="ln" x1="16" y1="514" x2="384" y2="514" opacity="0.25"/>
  <g class="rise" style="animation-delay:0.4s"><text class="m" x="16" y="548" font-size="11" letter-spacing="1.25">Nº 03</text><text class="m" x="384" y="548" font-size="11" letter-spacing="1" text-anchor="end">★ 0  ·  0 FORKS</text><text class="m" x="16" y="584" font-size="24" letter-spacing="-0.25">ModeYOLO</text><text class="m" x="16" y="614" font-size="14">Python package for colour-space transforms</text><text class="m" x="16" y="635" font-size="14">and building modified datasets for</text><text class="m" x="16" y="656" font-size="14">deep-learning training.</text><text class="m" x="16" y="687" font-size="10" letter-spacing="1" opacity="0.6">PYTHON · OPENCV · PYPI</text><line class="ln" x1="16" y1="701" x2="384" y2="701" opacity="0.25"/><text class="m" x="16" y="721" font-size="10" letter-spacing="1">UPDATED MAR 2024</text><text class="m" x="384" y="721" font-size="10" letter-spacing="1" text-anchor="end">SOURCE ↗</text></g>
  <line class="ln" x1="16" y1="747" x2="384" y2="747" opacity="0.25"/>
  <g class="rise" style="animation-delay:0.5s"><text class="m" x="16" y="781" font-size="11" letter-spacing="1.25">Nº 04</text><text class="m" x="384" y="781" font-size="11" letter-spacing="1" text-anchor="end">★ 0  ·  0 FORKS</text><text class="m" x="16" y="817" font-size="24" letter-spacing="-0.25">Sketchbook</text><text class="m" x="16" y="847" font-size="14">Part digital sketchbook, part professional</text><text class="m" x="16" y="868" font-size="14">portfolio — hand-drawn feel with smooth</text><text class="m" x="16" y="889" font-size="14">motion.</text><text class="m" x="16" y="920" font-size="10" letter-spacing="1" opacity="0.6">NEXT.JS · FRAMER MOTION · TYPESCRIPT</text><line class="ln" x1="16" y1="934" x2="384" y2="934" opacity="0.25"/><text class="m" x="16" y="954" font-size="10" letter-spacing="1">UPDATED APR 2026</text><text class="m" x="384" y="954" font-size="10" letter-spacing="1" text-anchor="end">LIVE DEMO ↗</text></g>
</svg>
