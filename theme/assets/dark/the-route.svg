<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 382" width="1000" height="382" fill="none" role="img" aria-label="Achievements">
  <style>
    .m{font-family:ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}
    text{fill:#FFFFFF}
    .ln{stroke:#FFFFFF;stroke-width:1;fill:none}
    .ink{fill:#FFFFFF}
    .stroke{stroke:#FFFFFF;fill:none}
    .outline{stroke:#FFFFFF}
    .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .fade{opacity:0;animation:fade .7s ease forwards}
    @keyframes fade{to{opacity:1}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
    @keyframes ring{0%{transform:scale(.4);opacity:.8}80%,100%{transform:scale(2.6);opacity:0}}
    .grow{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes grow{to{transform:scaleX(1)}}
    .eq{transform-box:fill-box;transform-origin:bottom;animation:eq .9s ease-in-out infinite alternate}
    @keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 3.2s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .caret{animation:caret 1.1s steps(1) infinite}
    @keyframes caret{50%{fill-opacity:0}}
    .nudge{animation:nudge 1.6s ease-in-out infinite}
    @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
    @media (prefers-reduced-motion:reduce){.draw,.rise,.fade,.pulse,.ring,.grow,.eq,.spin,.blink,.caret,.nudge,.anim{animation:none}.draw{stroke-dashoffset:0}.rise,.fade{opacity:1}.grow{transform:none}.ring{opacity:0}}
  </style>
  <g class="fade" style="animation-delay:0.1s"><text class="m" x="48" y="28" font-size="11" letter-spacing="3.5">ACHIEVEMENTS SO FAR</text><text class="m" x="952" y="28" font-size="11" letter-spacing="3.5" text-anchor="end">FIG. 11.1</text></g><line class="ln draw" x1="48" y1="40" x2="952" y2="40" pathLength="1" opacity="1" style="animation-delay:0.1s"/>
  <line class="ln draw" x1="60" y1="75" x2="60" y2="349" pathLength="1" opacity="0.5" style="animation-delay:0.2s"/>
  <g class="rise" style="animation-delay:0.2s"><circle class="ink" cx="60" cy="75" r="4"/><text class="m" x="84" y="80" font-size="11" letter-spacing="2.5">Nº 01</text><text class="m" x="150" y="80" font-size="15">Appointed as Campus Ambassador of IIT Madras</text><text class="m" x="952" y="80" font-size="10" letter-spacing="2" text-anchor="end">LINK ↗</text></g>
  <g class="rise" style="animation-delay:0.30000000000000004s"><circle class="ink" cx="60" cy="117" r="4"/><text class="m" x="84" y="122" font-size="11" letter-spacing="2.5">Nº 02</text><text class="m" x="150" y="122" font-size="15">Finished at 2nd position in the Entrepreneurship Awareness Camp</text></g>
  <g class="rise" style="animation-delay:0.4s"><circle class="ink" cx="60" cy="159" r="4"/><text class="m" x="84" y="164" font-size="11" letter-spacing="2.5">Nº 03</text><text class="m" x="150" y="164" font-size="15">Successfully completed Career Essentials in Software Development by Microsoft</text><text class="m" x="150" y="186" font-size="15">and LinkedIn</text><text class="m" x="952" y="164" font-size="10" letter-spacing="2" text-anchor="end">LINK ↗</text></g>
  <g class="rise" style="animation-delay:0.5s"><circle class="ink" cx="60" cy="223" r="4"/><text class="m" x="84" y="228" font-size="11" letter-spacing="2.5">Nº 04</text><text class="m" x="150" y="228" font-size="15">Participated in the House of Hackers Hackathon organized by IIIT Ranchi</text><text class="m" x="952" y="228" font-size="10" letter-spacing="2" text-anchor="end">LINK ↗</text></g>
  <g class="rise" style="animation-delay:0.6000000000000001s"><circle class="ink" cx="60" cy="265" r="4"/><text class="m" x="84" y="270" font-size="11" letter-spacing="2.5">Nº 05</text><text class="m" x="150" y="270" font-size="15">In 2023, participated in Hack4Bengal 2.0 — one of the biggest privately run hackathons</text></g>
  <g class="rise" style="animation-delay:0.7s"><circle class="ink" cx="60" cy="307" r="4"/><text class="m" x="84" y="312" font-size="11" letter-spacing="2.5">Nº 06</text><text class="m" x="150" y="312" font-size="15">Joined GDG Durgapur as a Graphics Designer for the core team</text></g>
  <g class="rise" style="animation-delay:0.8s"><circle class="stroke ring" cx="60" cy="349" r="5"/><circle class="ink pulse" cx="60" cy="349" r="4"/><text class="m" x="84" y="354" font-size="11" letter-spacing="2.5">Nº 07</text><text class="m" x="150" y="354" font-size="15">Started 2024 by joining Hack4Bengal 3.0 as a core Graphics Designer</text></g>
</svg>
