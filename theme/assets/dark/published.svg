  <line class="ln" x1="48" y1="120" x2="952" y2="120" opacity="0.25"/>
  <g class="rise" style="animation-delay:0.28s"><text class="m" x="48" y="152" font-size="11" letter-spacing="2.5">Nº 02</text><rect class="stroke" x="118.5" y="137.5" width="56" height="20"/><text class="m" x="147" y="152" font-size="10" letter-spacing="2" text-anchor="middle">PYPI</text><text class="m" x="196" y="152" font-size="16">localstore</text><text class="m" x="306" y="152" font-size="10" letter-spacing="2" opacity="0.6">v0.2.1</text><text class="m" x="196" y="174" font-size="12" opacity="0.7">Local product database with CSV → JSON and an instant local API.</text><text class="m" x="952" y="152" font-size="18" text-anchor="end">12</text><rect class="ink" opacity="0.15" x="832" y="166" width="120" height="4"/><rect class="ink grow" style="animation-delay:0.5s" x="832" y="166" width="40" height="4"/></g>
  <line class="ln" x1="48" y1="190" x2="952" y2="190" opacity="0.25"/>
  <g class="rise" style="animation-delay:0.36s"><text class="m" x="48" y="222" font-size="11" letter-spacing="2.5">Nº 03</text><rect class="stroke" x="118.5" y="207.5" width="56" height="20"/><text class="m" x="147" y="222" font-size="10" letter-spacing="2" text-anchor="middle">NPM</text><text class="m" x="196" y="222" font-size="16">trending-products</text><text class="m" x="373.2" y="222" font-size="10" letter-spacing="2" opacity="0.6">v1.0.3</text><text class="m" x="196" y="244" font-size="12" opacity="0.7">Fetch trending Amazon products and related Google Trends queries.</text><text class="m" x="952" y="222" font-size="18" text-anchor="end">18</text><rect class="ink" opacity="0.15" x="832" y="236" width="120" height="4"/><rect class="ink grow" style="animation-delay:0.6000000000000001s" x="832" y="236" width="60" height="4"/></g>
