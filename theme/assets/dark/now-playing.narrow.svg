<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 232" width="400" height="232" fill="none" role="img" aria-label="Last played on Spotify: Jhol — Maanu, Annural Khalid">
  <style>
    .m{font-family:ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}
    text{fill:#FFFFFF}
    .ln{stroke:#FFFFFF;stroke-width:1;fill:none}
    .ink{fill:#FFFFFF}
    .stroke{stroke:#FFFFFF;fill:none}
    .outline{stroke:#FFFFFF}
    text.paper{fill:#0D1117}
    .pop{transform-box:fill-box;transform-origin:center;opacity:0;animation:pop .5s cubic-bezier(.2,1.4,.4,1) forwards}
    @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
    .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .rise{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .fade{opacity:0;animation:fade .7s ease forwards}
    @keyframes fade{to{opacity:1}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
    @keyframes ring{0%{transform:scale(.4);opacity:.8}80%,100%{transform:scale(2.6);opacity:0}}
    .grow{transform-box:fill-box;transform-origin:left;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.7,.2,1) forwards}
    @keyframes grow{to{transform:scaleX(1)}}
    .eq{transform-box:fill-box;transform-origin:bottom;animation:eq .9s ease-in-out infinite alternate}
    @keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 3.2s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .blink{animation:blink 1.1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .caret{animation:caret 1.1s steps(1) infinite}
    @keyframes caret{50%{fill-opacity:0}}
    .nudge{animation:nudge 1.6s ease-in-out infinite}
    @keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
    @media (prefers-reduced-motion:reduce){.draw,.rise,.fade,.pulse,.ring,.grow,.eq,.spin,.blink,.caret,.nudge,.anim,.pop{animation:none}.draw{stroke-dashoffset:0}.rise,.fade,.pop{opacity:1}.grow{transform:none}.ring{opacity:0}}
  </style>
  <g class="fade" style="animation-delay:0.1s"><text class="m" x="16" y="28" font-size="11" letter-spacing="1.75">NOW PLAYING — SPOTIFY</text><text class="m" x="384" y="28" font-size="11" letter-spacing="1.75" text-anchor="end">FIG. 12.1</text></g><line class="ln draw" x1="16" y1="40" x2="384" y2="40" pathLength="1" opacity="1" style="animation-delay:0.1s"/>
  <g class="fade" style="animation-delay:0.2s"><g transform="translate(66 114) scale(0.735) translate(-66 -114)"><g class=""><circle class="stroke" cx="66" cy="114" r="60" opacity="1"/><circle class="stroke" cx="66" cy="114" r="50" opacity="0.3"/><circle class="stroke" cx="66" cy="114" r="40" opacity="0.3"/><circle class="ink" cx="66" cy="114" r="20"/><path class="ln" d="M92 84 A40 40 0 0 1 104 102" stroke-width="2"/><circle class="stroke" cx="66" cy="114" r="3"/></g></g></g>
  <g class="fade" style="animation-delay:0.3s"><text class="m" x="136" y="82" font-size="11" letter-spacing="1.5">PLAYED · 19 OCT · 06:11</text></g>
  <g class="rise" style="animation-delay:0.4s"><text class="m" x="136" y="122" font-size="22" letter-spacing="-0.25">Jhol</text></g>
  <g class="rise" style="animation-delay:0.5s"><text class="m" x="136" y="150" font-size="15">Maanu, Annural Khalid</text></g>
  <g class="fade" style="animation-delay:0.6s"><text class="m" x="136" y="174" font-size="11" letter-spacing="1.25" opacity="0.6">JHOL</text></g>
  <line class="ln draw" x1="136" y1="191" x2="384" y2="191" pathLength="1" opacity="0.5" style="animation-delay:0.6s"/>
  <g class="fade" style="animation-delay:0.8s"><text class="m" x="384" y="210" font-size="10" letter-spacing="1" text-anchor="end">4:25</text></g>
</svg>
